// Decode flat hex string to Uint8Array of palette indices
const IDX=new Uint8Array(DATA.length);
for(let i=0;i<DATA.length;i++) IDX[i]=parseInt(DATA[i],16);

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let animId=null;

function run(){
  if(animId) cancelAnimationFrame(animId);

  const VW=canvas.width=window.innerWidth;
  const VH=canvas.height=window.innerHeight;

  const GAP=1;
  const CELL=Math.max(2,Math.min(Math.floor(VW/COLS),Math.floor(VH/ROWS))-GAP);
  const STEP=CELL+GAP;
  const TOTAL=COLS*ROWS;

  const ox=Math.floor((VW-COLS*STEP)/2);
  const oy=Math.floor((VH-ROWS*STEP)/2);

  function getCol(c,r){ return PAL[IDX[r*COLS+c]]; }

  function drawCell(col,row,r,g,b){
    const x=ox+col*STEP,y=oy+row*STEP;
    ctx.fillStyle='rgb('+r+','+g+','+b+')';
    ctx.fillRect(x,y,CELL,CELL);
  }

  const state=new Uint8Array(TOTAL);
  const timer=new Float32Array(TOTAL);
  const NEON_HOLD=12;
  let empty=TOTAL;

  const drops=Array.from({length:COLS},()=>([
    {y:-(Math.random()*ROWS*0.4),       speed:0.625+Math.random()*0.78},
    {y:-(Math.random()*ROWS*0.4+ROWS*0.5),speed:0.625+Math.random()*0.78},
  ]));

  function activate(idx,tv){
    if(state[idx]===0){state[idx]=1;timer[idx]=tv;empty--;}
  }

  let glitchActive=false;
  let glitchTimeout=null;
  function glitch(ex,ey){
    const col=Math.floor((ex-ox)/STEP);
    const row=Math.floor((ey-oy)/STEP);
    const count=2+Math.floor(Math.random()*3);
    for(let i=0;i<count;i++){
      const c=col+Math.floor(Math.random()*7)-3;
      const r=row+Math.floor(Math.random()*7)-3;
      if(c<0||c>=COLS||r<0||r>=ROWS) continue;
      const idx=r*COLS+c;
      if(state[idx]===2){state[idx]=1;timer[idx]=6+Math.random()*6;}
    }
    glitchActive=true;
    if(!animId) animId=requestAnimationFrame(render);
    clearTimeout(glitchTimeout);
    glitchTimeout=setTimeout(()=>{glitchActive=false;},400);
  }

  canvas.addEventListener('mousemove',e=>{ if(Math.random()>0.06) return; glitch(e.clientX,e.clientY); });
  canvas.addEventListener('touchmove',e=>{ e.preventDefault(); if(Math.random()>0.1) return; const t=e.touches[0]; glitch(t.clientX,t.clientY); },{passive:false});

  function render(){
    ctx.fillStyle='#434D14';
    ctx.fillRect(0,0,VW,VH);

    for(let col=0;col<COLS;col++){
      for(const d of drops[col]){
        const h=Math.floor(d.y);
        for(let t=0;t<14;t++){
          const row=h-t;
          if(row>=0&&row<ROWS) activate(row*COLS+col,Math.max(2,NEON_HOLD-t));
        }
        d.y+=d.speed;
        if(d.y>ROWS+2){
          let fe=-1;
          for(let r=0;r<ROWS;r++){if(state[r*COLS+col]===0){fe=r;break;}}
          if(fe>=0){d.y=fe-2-Math.random()*3;d.speed=0.94+Math.random()*0.78;}
          else d.y=ROWS+99;
        }
      }
    }

    let settled=0;
    for(let idx=0;idx<TOTAL;idx++){
      const col=idx%COLS,row=Math.floor(idx/COLS);
      const s=state[idx];
      if(s===0) continue;
      if(s===1){
        if(timer[idx]>0){
          const a=Math.min(1,timer[idx]/NEON_HOLD);
          drawCell(col,row,0,Math.round(255*a),Math.round(65*a));
          timer[idx]--;
        }else{state[idx]=2;}
      }
      if(s===2){
        const [r,g,b]=getCol(col,row);
        drawCell(col,row,r,g,b);
        settled++;
      }
    }

    if(settled<TOTAL||glitchActive) animId=requestAnimationFrame(render);
    else animId=null;
  }

  render();
}

run();
let t, lastW=window.innerWidth, lastH=window.innerHeight;
window.addEventListener('resize',()=>{
  clearTimeout(t);
  t=setTimeout(()=>{
    if(Math.abs(window.innerWidth-lastW)>20||Math.abs(window.innerHeight-lastH)>80){
      lastW=window.innerWidth;lastH=window.innerHeight;run();
    }
  },400);
});

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let animId=null;

function run(){
  if(animId) cancelAnimationFrame(animId);
  const VW=canvas.width=window.innerWidth;
  const VH=canvas.height=window.innerHeight;
  const STEP=Math.ceil(Math.max(VW/COLS,VH/ROWS));
  const GRIDW=COLS*STEP,GRIDH=ROWS*STEP;
  const ox=Math.floor((VW-GRIDW)/2);
  const oy=Math.floor((VH-GRIDH)/2);
  const TOTAL=COLS*ROWS;
  const NEON_HOLD=12;

  function drawCell(col,row,r,g,b){
    const x=ox+col*STEP,y=oy+row*STEP;
    ctx.fillStyle='rgb('+r+','+g+','+b+')';
    ctx.fillRect(x,y,STEP,STEP);
    if(STEP>=4){
      ctx.strokeStyle='rgba(0,0,0,0.10)';
      ctx.lineWidth=1;
      ctx.strokeRect(x+.5,y+.5,STEP-1,STEP-1);
      const hx=x+STEP/2,hy=y+STEP/2,d=STEP*0.22;
      ctx.fillStyle='rgba(0,0,0,0.20)';
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+STEP,y);ctx.lineTo(hx,y+d);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(x,y+STEP);ctx.lineTo(x+STEP,y+STEP);ctx.lineTo(hx,y+STEP-d);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+STEP);ctx.lineTo(x+d,hy);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(x+STEP,y);ctx.lineTo(x+STEP,y+STEP);ctx.lineTo(x+STEP-d,hy);ctx.closePath();ctx.fill();
    }
  }

  const state=new Uint8Array(TOTAL);
  const timer=new Float32Array(TOTAL);
  let glitchActive=false,glitchTimeout=null;

  const drops=Array.from({length:COLS},()=>([
    {y:-(Math.random()*ROWS*.4),speed:.8+Math.random()*.9},
    {y:-(Math.random()*ROWS*.4+ROWS*.5),speed:.8+Math.random()*.9},
  ]));

  function activate(idx,tv){
    if(state[idx]===0){state[idx]=1;timer[idx]=tv;}
  }

  function glitch(ex,ey){
    const col=Math.floor((ex-ox)/STEP),row=Math.floor((ey-oy)/STEP);
    for(let i=0;i<2+Math.floor(Math.random()*3);i++){
      const c=col+Math.floor(Math.random()*9)-4;
      const r=row+Math.floor(Math.random()*9)-4;
      if(c<0||c>=COLS||r<0||r>=ROWS) continue;
      const idx=r*COLS+c;
      if(state[idx]===2){state[idx]=1;timer[idx]=6+Math.random()*6;}
    }
    glitchActive=true;
    if(!animId) animId=requestAnimationFrame(render);
    clearTimeout(glitchTimeout);
    glitchTimeout=setTimeout(()=>{glitchActive=false;},400);
  }

  canvas.addEventListener('mousemove',e=>{if(Math.random()>.06)return;glitch(e.clientX,e.clientY);});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();if(Math.random()>.1)return;const t=e.touches[0];glitch(t.clientX,t.clientY);},{passive:false});

  function render(){
    ctx.fillStyle='#111';
    ctx.fillRect(0,0,VW,VH);
    for(let col=0;col<COLS;col++){
      for(const d of drops[col]){
        const h=Math.floor(d.y);
        for(let t=0;t<18;t++){
          const row=h-t;
          if(row>=0&&row<ROWS) activate(row*COLS+col,Math.max(2,NEON_HOLD-t));
        }
        d.y+=d.speed;
        if(d.y>ROWS+2){
          let fe=-1;
          for(let r=0;r<ROWS;r++){if(state[r*COLS+col]===0){fe=r;break;}}
          if(fe>=0){d.y=fe-2-Math.random()*3;d.speed=.9+Math.random()*.8;}
          else d.y=ROWS+99;
        }
      }
    }
    let settled=0;
    for(let idx=0;idx<TOTAL;idx++){
      const col=idx%COLS,row=Math.floor(idx/COLS);
      const s=state[idx];
      if(s===0) continue;
      if(s===1){
        if(timer[idx]>0){
          const a=Math.min(1,timer[idx]/NEON_HOLD);
          drawCell(col,row,0,Math.round(255*a),Math.round(65*a));
          timer[idx]--;
        } else {state[idx]=2;}
      }
      if(s===2){
        const [r,g,b]=PAL[IDX[idx]];
        drawCell(col,row,r,g,b);
        settled++;
      }
    }
    if(settled<TOTAL||glitchActive) animId=requestAnimationFrame(render);
    else animId=null;
  }
  render();
}

run();
let _t,lastW=window.innerWidth,lastH=window.innerHeight;
window.addEventListener('resize',()=>{
  clearTimeout(_t);
  _t=setTimeout(()=>{
    if(Math.abs(window.innerWidth-lastW)>20||Math.abs(window.innerHeight-lastH)>80){
      lastW=window.innerWidth;lastH=window.innerHeight;run();
    }
  },400);
});
</script>
